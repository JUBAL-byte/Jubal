name: JUBAL APK

on:
  push:
    branches: [qeshev]
  workflow_dispatch:
    inputs:
      extractor:
        description: "NewPipe extractor version to build with (empty: the one in extractor.version)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: qeshev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # JitPack builds a new extractor version the first time someone asks for it
      - name: Wait for JitPack
        if: inputs.extractor != ''
        env:
          V: ${{ inputs.extractor }}
        run: |
          for i in $(seq 1 15); do
            if curl -fsS -o /dev/null "https://jitpack.io/com/github/TeamNewPipe/NewPipeExtractor/$V/NewPipeExtractor-$V.pom"; then
              echo "ready"; exit 0
            fi
            sleep 60
          done
          echo "JitPack not ready yet, trying the build anyway"

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          EXTRACTOR_VERSION: ${{ inputs.extractor }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="JUBAL-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "jubal-app-${{ github.run_number }}" "$APK" \
            --target "${{ github.sha }}" \
            --title "JUBAL ${{ github.run_number }}" \
            --notes "JUBAL: מוזיקה, הסכתים ושמע מיוטיוב, בלי תמונות ובלי וידאו. מתקינים את הקובץ $APK בטלפון, מעל הגרסה הקודמת. (extractor: ${{ inputs.extractor }}$(test -n "${{ inputs.extractor }}" || cat extractor.version))" \
            --latest=false

      # Only after a good build: remember the newer extractor for the next builds
      - name: Keep the newer extractor
        if: inputs.extractor != ''
        env:
          V: ${{ inputs.extractor }}
        run: |
          echo "$V" > extractor.version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extractor.version
          git commit -m "Build with NewPipe extractor $V for the latest YouTube fixes [skip ci]" || exit 0
          git push origin HEAD:qeshev

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          grep -E "^e: |error:|What went wrong|Could not|FAILED" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true
          gh release delete qeshev-log --yes --cleanup-tag || true
          gh release create qeshev-log build.log \
            --target "${{ github.sha }}" \
            --title "Qeshev build log" \
            --notes "Last failed build log" \
            --prerelease --latest=false
