name: Jubal CI

# Runs the full verification chain on every push to main, writes its own output
# back to the `ci-logs` branch (so the logs can be read with a plain git fetch),
# and publishes the finished APKs as a GitHub Release that can be downloaded
# straight onto a phone.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Write .env
        run: |
          cat > .env <<'EOF'
          ENABLE_UPDATE_CHECK=0
          LASTFM_API_KEY=00000000000000000000000000000000
          LASTFM_API_SECRET=00000000000000000000000000000000
          RELEASE_CHANNEL=stable
          HIDE_DONATIONS=0
          EOF
          mkdir -p ci

      - name: flutter pub get
        continue-on-error: true
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ci/01-pub-get.txt

      - name: build_runner
        continue-on-error: true
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee ci/02-build-runner.txt

      - name: flutter analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ci/03-analyze.txt

      # One APK per CPU architecture instead of a single 240 MB fat file.
      # A Pixel installs the arm64-v8a one.
      - name: Build release APKs
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --flavor stable --split-per-abi 2>&1 | tee ci/04-build-apk.txt

      - name: Collect summary
        if: always()
        run: |
          {
            echo "run      : ${{ github.run_number }}"
            echo "commit   : ${{ github.sha }}"
            echo "finished : $(date -u +%FT%TZ)"
            echo
            echo "### analyze - errors only"
            grep "error •" ci/03-analyze.txt 2>/dev/null || echo "(no errors)"
            echo
            echo "### analyze - totals"
            tail -n 3 ci/03-analyze.txt 2>/dev/null || echo "(missing)"
            echo
            echo "### apk build - tail"
            tail -n 60 ci/04-build-apk.txt 2>/dev/null || echo "(missing)"
            echo
            echo "### artifacts"
            ls -la build/app/outputs/flutter-apk/ 2>&1 || echo "(no apk directory)"
          } > ci/00-summary.txt
          cat ci/00-summary.txt

      - name: Publish APKs as a release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(build/app/outputs/flutter-apk/*-release.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no release apk produced; skipping release"
            exit 0
          fi
          gh release create "build-${{ github.run_number }}" "${files[@]}" \
            --title "Jubal build ${{ github.run_number }}" \
            --notes "Automatic build from ${{ github.sha }}. Install the arm64-v8a file on a Pixel."

      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          git config user.name  "jubal-ci"
          git config user.email "ci@jubal.local"
          rm -rf /tmp/cilogs && mkdir -p /tmp/cilogs
          cp ci/*.txt /tmp/cilogs/ 2>/dev/null || true
          git checkout --orphan ci-logs-tmp
          git reset --hard >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/cilogs/*.txt . 2>/dev/null || true
          echo "run ${{ github.run_number }} for ${{ github.sha }}" > RUN.txt
          git add -A
          git commit -m "ci: run ${{ github.run_number }} for ${{ github.sha }}"
          git push -f origin ci-logs-tmp:ci-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jubal-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore
          retention-days: 30
