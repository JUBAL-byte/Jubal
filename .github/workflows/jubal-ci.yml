name: Jubal CI

# Every push to main runs the whole verification chain and writes its own
# output back into the repository on the `ci-logs` branch, so the logs can be
# read with a plain `git fetch` — no API access and no manual copying.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Write .env
        run: |
          cat > .env <<'EOF'
          ENABLE_UPDATE_CHECK=0
          LASTFM_API_KEY=00000000000000000000000000000000
          LASTFM_API_SECRET=00000000000000000000000000000000
          RELEASE_CHANNEL=stable
          HIDE_DONATIONS=0
          EOF
          mkdir -p ci

      - name: flutter pub get
        continue-on-error: true
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ci/01-pub-get.txt

      - name: build_runner
        continue-on-error: true
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee ci/02-build-runner.txt

      - name: flutter analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ci/03-analyze.txt

      - name: Install pinned NDK
        continue-on-error: true
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMAN" ] || SDKMAN="$(command -v sdkmanager || true)"
          if [ -n "$SDKMAN" ]; then
            yes | "$SDKMAN" --install "ndk;29.0.14206865" > ci/05-ndk.txt 2>&1 || true
          else
            echo "sdkmanager not found" > ci/05-ndk.txt
          fi

      - name: Build debug APK
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug --flavor stable 2>&1 | tee ci/04-build-apk.txt

      - name: Collect summary
        if: always()
        run: |
          {
            echo "run      : ${{ github.run_number }}"
            echo "commit   : ${{ github.sha }}"
            echo "finished : $(date -u +%FT%TZ)"
            echo
            echo "### analyze — issue lines"
            grep -E "^( *)(error|warning|info) " ci/03-analyze.txt 2>/dev/null | head -n 200 || echo "(no analyze output)"
            echo
            echo "### analyze — tail"
            tail -n 30 ci/03-analyze.txt 2>/dev/null || echo "(missing)"
            echo
            echo "### apk build — tail"
            tail -n 80 ci/04-build-apk.txt 2>/dev/null || echo "(missing)"
            echo
            echo "### artifacts"
            ls -la build/app/outputs/flutter-apk/ 2>&1 || echo "(no apk directory)"
          } > ci/00-summary.txt
          cat ci/00-summary.txt

      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          git config user.name  "jubal-ci"
          git config user.email "ci@jubal.local"
          rm -rf /tmp/cilogs && mkdir -p /tmp/cilogs
          cp ci/*.txt /tmp/cilogs/ 2>/dev/null || true
          git checkout --orphan ci-logs-tmp
          git reset --hard >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/cilogs/*.txt . 2>/dev/null || true
          echo "run ${{ github.run_number }} for ${{ github.sha }}" > RUN.txt
          git add -A
          git commit -m "ci: run ${{ github.run_number }} for ${{ github.sha }}"
          git push -f origin ci-logs-tmp:ci-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jubal-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore
          retention-days: 30
